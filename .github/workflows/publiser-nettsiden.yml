name: Publiser nettsiden

# Publiserer mappa banedagbok til GitHub Pages hver gang den endres på main,
# og bordoversikt-appen under /bordoversikt/.
# Engangsoppsett: Settings → Pages → Source: «GitHub Actions».
on:
  push:
    branches: [main]
    paths: ["banedagbok/**", "bordoversikt/**", ".github/workflows/publiser-nettsiden.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiser:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Sett sammen nettstedet
        run: |
          mkdir -p _site
          cp -r banedagbok/. _site/
          mkdir -p _site/bordoversikt
          cp -r bordoversikt/. _site/bordoversikt/
          rm -f _site/bordoversikt/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

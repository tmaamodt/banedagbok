name: Publiser nettsiden

# Publiserer mappa banedagbok til GitHub Pages hver gang den endres på main.
# Engangsoppsett: Settings → Pages → Source: «GitHub Actions».
on:
  push:
    branches: [main]
    paths: ["banedagbok/**", ".github/workflows/publiser-nettsiden.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiser:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: banedagbok
      - id: deploy
        uses: actions/deploy-pages@v4
